<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Train</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c10;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* The stage is the largest 16:9 box that fits the window. The world canvas
       and the UI layer both fill it exactly, so UI positions line up with the
       world no matter the window size. `container-type: size` lets the UI size
       things in cqw/cqh units (percent of the stage). */
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      container-type: size;
      background: #15171d;
      overflow: hidden;
    }
    #world, #ui, .ui-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* The UI never takes mouse input; the whole game is keyboard-driven. */
    #ui {
      pointer-events: none;
    }
  </style>
  <!-- All UI styling (HUD, screens, transitions) lives here, next to src/ui.js. -->
  <link rel="stylesheet" href="src/ui.css">
</head>
<body>
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="ui"></div>
  </div>

  <!--
    Plain classic scripts, NOT ES modules: browsers block `import` on pages opened
    straight from disk (file://), and the spec requires that opening index.html runs
    the game. Each file defines a few globals, so ORDER MATTERS: a file may only use
    globals from files listed above it. main.js goes last because it starts the game.
  -->
  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/train.js"></script>
  <script src="src/passenger.js"></script>
  <script src="src/station.js"></script>
  <script src="src/round.js"></script>
  <script src="src/intro.js"></script>
  <script src="src/render/canvas2d.js"></script>
  <!-- WebGL renderer files (in dependency order); webgl.js defines WebGLRenderer. -->
  <script src="src/render/webgl.js"></script>
  <!-- /WebGL renderer files -->
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
